name: Release Docker Image

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  WASM_PACK_VERSION: 0.15.0

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: rust:1-slim-bookworm
      # The `db` crate's integration tests use testcontainers, which talks to the
      # runner's Docker daemon through /var/run/docker.sock. The GitHub runner
      # already bind-mounts that socket into every container job, so no explicit
      # `options:` mount is needed (adding one causes "Duplicate mount point").
      # testcontainers-rs detects /.dockerenv and resolves the mapped ports via
      # the bridge network gateway, so the Postgres container is reachable from
      # inside this job container.
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        # `cargo test --workspace` compiles rdap-wasm natively, pulling
        # icann-rdap-client -> reqwest(native-tls-vendored) -> openssl-sys, which
        # builds OpenSSL from source and needs full perl (FindBin) + make.
        #
        # It also builds dns-explorer, whose build.rs runs `wasm-pack` over
        # dns-wasm. dns-wasm's hickory-proto `dnssec-ring` feature pulls `ring`,
        # which compiles C for wasm32-unknown-unknown; cc-rs defaults to `clang`
        # for that target (gcc cannot target wasm32), so clang must be present.
        run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates clang perl make

      - name: Install wasm toolchain
        # rdap-explorer/build.rs invokes wasm-pack, so it must be present to build.
        run: |
          rustup target add wasm32-unknown-unknown
          curl -fsSL "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C /usr/local/bin --strip-components=1 \
                "wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack"

      - name: Test
        # `db/testutil` enables the testcontainers-backed `fresh_db()` helper the
        # db and support-bin integration tests need (Docker socket is mounted above).
        run: cargo test --workspace --features db/testutil

  # Each architecture is built natively (no QEMU) and pushed under a temporary
  # arch-suffixed tag; merge-manifest then combines them into one multi-arch
  # manifest list. Native arm64 compilation avoids the ~11x QEMU slowdown.
  build-amd64:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
          flavor: |
            suffix=-amd64

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-arm64:
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
          flavor: |
            suffix=-arm64

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  merge-manifest:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need all tags to determine the newest version

      - name: Determine if this tag is the newest
        id: newest
        run: |
          highest="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          echo "highest=${highest}"
          if [ "${highest}" = "${GITHUB_REF_NAME}" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ steps.newest.outputs.is_latest }}

      - name: Merge arch manifests into multi-arch manifest list
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "${tag}" ] && args+=(--tag "${tag}")
          done <<< "${TAGS}"
          annotations=()
          while IFS= read -r a; do
            [ -n "${a}" ] && annotations+=(--annotation "${a}")
          done <<< "${ANNOTATIONS}"
          docker buildx imagetools create "${args[@]}" "${annotations[@]}" \
            "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}-amd64" \
            "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}-arm64"
