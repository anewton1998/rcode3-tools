name: Release Docker Image

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  WASM_PACK_VERSION: 0.15.0

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: rust:1-slim-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        # `cargo test --workspace` compiles rdap-wasm natively, pulling
        # icann-rdap-client -> reqwest(native-tls-vendored) -> openssl-sys, which
        # builds OpenSSL from source and needs full perl (FindBin) + make.
        run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates perl make

      - name: Install wasm toolchain
        # rdap-lookup/build.rs invokes wasm-pack, so it must be present to build.
        run: |
          rustup target add wasm32-unknown-unknown
          curl -fsSL "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C /usr/local/bin --strip-components=1 \
                "wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack"

      - name: Test
        run: cargo test --workspace

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need all tags to determine the newest version

      - name: Determine if this tag is the newest
        id: newest
        run: |
          highest="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          echo "highest=${highest}"
          if [ "${highest}" = "${GITHUB_REF_NAME}" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ steps.newest.outputs.is_latest }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
