[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace]
members = [
    "crates/ui-components",
    "crates/rdap-wasm",
    "crates/dns-wasm",
    "apps/rdap-explorer",
    "apps/dns-explorer",
    "apps/rcode3-tools",
    "apps/rcode3-gateway",
]
resolver = "2"

[workspace.dependencies]
askama = { version = "0.16", features = ["full"] }
axum = "0.8"
base64 = "0.22"
dotenvy = "0.15"
hickory-proto = "0.26"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
icann-rdap-client = { git = "https://github.com/icann/icann-rdap.git", branch = "dev" }
icann-rdap-common = { git = "https://github.com/icann/icann-rdap.git", branch = "dev" }
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
