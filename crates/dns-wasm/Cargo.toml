[package]
name = "dns-wasm"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64.workspace = true
# chrono renders the TTL as a human expiry. `wasmbind` is a chrono *default*
# feature, so `chrono::Local`/`Utc::now` already resolve via the browser's
# `Date` on wasm32 and via the system clock on native — no target-specific
# feature toggle is required.
chrono = "0.4"
# hickory-proto provides the DNS wire format (Message/Query/Record/RecordType).
# The `wasm-bindgen` feature swaps in browser-compatible time handling so the
# crate compiles to wasm32-unknown-unknown; `serde` enables JSON download of
# parsed messages.
# `dnssec-ring` compiles the `dnssec` module (DS/DNSKEY rdata types) with the
# ring crypto backend, which builds for both native and wasm32-unknown-unknown.
hickory-proto = { workspace = true, features = ["serde", "wasm-bindgen", "dnssec-ring"] }
# Reuses the shared reverse-DNS name builder so A/AAAA addresses link to PTR
# queries with the same mapping used by the RDAP explorer's rdns query types.
icann-rdap-common.workspace = true
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen.workspace = true
serde_json = "1"
thiserror = "2"
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
# reqwest uses the browser fetch backend on wasm32 (via the `wasmbind` feature)
# and rustls/hyper on native, so the same lookup code runs in both worlds.
reqwest.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# hickory-proto's rand (query ids) bottoms out in getrandom, which needs the
# wasm_js backend to compile for the browser.
getrandom = { version = "0.4", features = ["wasm_js"] }
# The `dnssec-ring` feature pulls ring, whose `SystemRandom` only implements
# `SecureRandom` on wasm32-unknown-unknown when ring's own
# `wasm32_unknown_unknown_js` feature is on (it forwards to getrandom 0.2's
# `js` backend). Enabling it here unifies with the ring instance hickory
# builds against.
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
# `CAA::new_iodef` takes a `url::Url`; used only by the render tests to
# build a `mailto:` CAA record end-to-end.
url = "2"
