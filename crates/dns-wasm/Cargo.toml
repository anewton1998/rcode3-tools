[package]
name = "dns-wasm"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64.workspace = true
# hickory-proto provides the DNS wire format (Message/Query/Record/RecordType).
# The `wasm-bindgen` feature swaps in browser-compatible time handling so the
# crate compiles to wasm32-unknown-unknown; `serde` enables JSON download of
# parsed messages.
hickory-proto = { workspace = true, features = ["serde", "wasm-bindgen"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen.workspace = true
serde_json = "1"
thiserror = "2"
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
# reqwest uses the browser fetch backend on wasm32 (via the `wasmbind` feature)
# and rustls/hyper on native, so the same lookup code runs in both worlds.
reqwest.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# hickory-proto's rand (query ids) bottoms out in getrandom, which needs the
# wasm_js backend to compile for the browser.
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
