<!doctype html>
<html lang="en" class="{{ theme }}">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}RDAP Lookup{% endblock %}</title>
    <link rel="stylesheet" href="/base.css" />
</head>
<body>
    {% block content %}{% endblock %}
    <script type="module">
        import initRdap, * as RdapClient from '/static/wasm/rdap_wasm.js';
        await initRdap();
        if (window.RDAP_BOOTSTRAP_URL) {
            RdapClient.set_bootstrap_url(window.RDAP_BOOTSTRAP_URL);
        }
        window.RdapClient = RdapClient;
    </script>
    <script src="/static/vendor/htmx.min.js"></script>
    <script src="/static/vendor/alpine.min.js" defer></script>
</body>
</html>
