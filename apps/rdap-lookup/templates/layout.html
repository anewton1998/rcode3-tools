<!doctype html>
<html lang="en" class="{{ theme }}">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}RDAP Lookup{% endblock %}</title>
    <link rel="icon" href="/static/images/favicon.ico" sizes="48x48">
    <link rel="icon" href="/static/images/favicon.svg" type="image/svg+xml">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/images/favicon-16.png">
    <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png">
    <link rel="manifest" href="/static/images/site.webmanifest">
    <meta name="theme-color" content="#0B1220">
    <meta property="og:title" content="rcode3">
    <meta property="og:image" content="https://rcode3.com/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://rcode3.com/og-image.png">
    <link rel="stylesheet" href="/base.css" />
</head>
<body>
    {% block content %}{% endblock %}
    <script type="module">
        import initRdap, * as RdapClient from '/static/wasm/rdap_wasm.js';
        await initRdap();
        if (window.RDAP_BOOTSTRAP_URL) {
            RdapClient.set_bootstrap_url(window.RDAP_BOOTSTRAP_URL);
        }
        window.RdapClient = RdapClient;
    </script>
    <script src="/static/vendor/htmx.min.js"></script>
    <script src="/static/vendor/alpine.min.js" defer></script>
</body>
</html>
