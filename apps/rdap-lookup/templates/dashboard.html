{% extends "layout.html" %}

{% block title %}Dashboard · RDAP Lookup{% endblock %}

{% block content %}
<main class="main_panel">
    <header class="site_banner">
        <a href="{{ home_url }}"><img src="{{ base }}/static/images/logo-1024.png" alt="rcode3 logo" class="site_logo"></a>
        <rcode3-site-name>rcode3</rcode3-site-name>
    </header>
    {{ button_html|safe }}
    <div id="status-message"></div>

    <div x-data="{ query: '', result: '', error: '', busy: false }">
        {{ search_input_html|safe }}
        <button id="lookup-btn" class="rcode3_button" :disabled="busy"
                @click="async () => {
                    busy = true; error = '';
                    try { result = await window.RdapClient.rdap_lookup_html(query); }
                    catch (e) { error = String(e); result = ''; }
                    busy = false;
                }">Lookup</button>
        <div x-html="result"></div>
        <span class="error_text" x-show="error" x-text="error"></span>
    </div>
</main>
{% endblock %}
